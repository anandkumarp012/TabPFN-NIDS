# ==========================================================================
# TabPFN-NIDS Live Capture Configuration
# ==========================================================================
# Parameters for the real-time monitoring pipeline.
# Values can also be overridden via NIDS_* environment variables.
# See src/tabpfn_nids/live/config.py for the full list.
#
# Run the API with:
#   pip install fastapi uvicorn websockets
#   uvicorn tabpfn_nids.api.main:app --host 0.0.0.0 --port 8000
#
# Then open: http://localhost:8000/
# ==========================================================================


# ---------------------------------------------------------------------------
# Packet Capture (TShark / Npcap)
# ---------------------------------------------------------------------------
capture:
  # Network interface to capture on (null = must be specified via API).
  # Use 'tshark -D' to list available interfaces, then copy the name.
  # Examples: "Wi-Fi", "Ethernet", "Local Area Connection"
  interface: null

  # Path to tshark binary.
  # On Windows: usually "C:/Program Files/Wireshark/tshark.exe"
  # If tshark is on PATH, just use "tshark".
  tshark_path: "tshark"

  # Bounded packet queue size. Packets dropped when queue is full.
  # Increase if you see high packet drop rates.
  packet_queue_size: 10000

  # Poll interval for capture loop internals (seconds).
  capture_poll_interval: 0.05


# ---------------------------------------------------------------------------
# Detection Windows
# ---------------------------------------------------------------------------
detection:
  # Sliding window duration in seconds.
  # Larger = more flows per window = better accuracy but more latency.
  window_size_seconds: 10.0

  # How often a new window is triggered (step < window_size = overlap).
  step_seconds: 5.0

  # Flow idle timeout in seconds.
  # Flows inactive longer than this are finalized and submitted.
  # Shorter = lower latency but smaller flows.
  flow_timeout_seconds: 10.0

  # Minimum packets a flow must have to be submitted for inference.
  min_flow_packets: 2


# ---------------------------------------------------------------------------
# Inference
# ---------------------------------------------------------------------------
inference:
  # Maximum parallel inference threads.
  # Start with 2; increase if inference is backlogged.
  max_workers: 2

  # Maximum size of the job queue before windows are dropped.
  queue_size: 100

  # Paths to trained artifacts (null = use default discovered path).
  # Run scripts/train_pipeline.py first to generate these.
  model_path: null
  scaler_path: null
  feature_schema_path: null


# ---------------------------------------------------------------------------
# WebSocket
# ---------------------------------------------------------------------------
websocket:
  enabled: true

  # Seconds between periodic status broadcasts to dashboard.
  status_interval_seconds: 2.0
